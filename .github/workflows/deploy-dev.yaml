name: "Deploy dev"
on:
    push:
        branches:
            - "dev-*"
            - "main"
    workflow_dispatch:

jobs:
    build:
        name: "build"
        runs-on: "ubuntu-latest"

        permissions:
            contents: "read"
            id-token: "write"
            packages: "write"

        env:
            YARN_NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

        steps:
            - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

            - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7
              with:
                  node-version: 24
                  cache: "yarn"

            - name: "Install dependencies"
              run: "yarn install --immutable"

            - name: "Build application"
              run: "yarn build"
              env:
                  ASTRO_KEY: ${{ secrets.ASTRO_KEY }}

            - name: "Prune devDependencies"
              run: "npm prune --omit=dev --legacy-peer-deps"

            - name: "Upload to cdn"
              uses: nais/deploy/actions/cdn-upload/v2@9850be311389ca754d9a9f2280615419d738c891 # master
              with:
                  team: dusseldorf # Change this to your team name
                  source: ./dist/client/_astro
                  destination: "aktivitetspenger-innsyn-mikrofrontend-ssr" # Change this to your application name

            - name: "Build and push"
              uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a # v0
              id: docker-build-push
              with:
                  team: dusseldorf # Change this to your team name

        outputs:
            image: ${{ steps.docker-build-push.outputs.image }}

    update-manifest-dev:
        uses: navikt/tms-deploy/.github/workflows/oppdater-mikrofrontend-manifest-v3.yaml@71678a4147620d62d582b57fe30e1527b4add74f # main
        needs: build
        permissions:
            contents: "read"
        with:
            id: "aktivitetspenger-innsyn" # Change this to your microfrontend id.
            url: "http://aktivitetspenger-innsyn-mikrofrontend-ssr.dusseldorf" # Change the url to contain your application name. Example: http://my-app
            appname: "aktivitetspenger-innsyn-mikrofrontend-ssr" # Change this to your application name
            namespace: "dusseldorf" # Change this to your namespace
            cluster: dev-gcp
            commitmsg: ${{ github.event.head_commit.message}}
            fallback: "fallback" # Should containt the path to the fallback page after src/pages/[locale]/... Only needs to be changed if you move the fallback in the pages structure
            ssr: true
        secrets: inherit

    deploy-dev:
        runs-on: "ubuntu-latest"
        permissions:
            contents: "read"
            id-token: "write"
        needs: [build, update-manifest-dev]
        steps:
            - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
            - name: "Deploy to dev"
              uses: "nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891" # v3
              env:
                  CLUSTER: dev-gcp
                  RESOURCE: nais/dev-gcp/nais.yaml
                  VAR: image=${{ needs.build.outputs.image }},version=${{ github.sha }}
